# Vale checks every page before it's published. The Google developer style, alex (inconsiderate wording) and
# Readability are the open-source packages from errata-ai, pinned in styles/VERSIONS. Portfolio holds the house rules
# that came out of the audit.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Portfolio

[*.{md,mdx}]
BasedOnStyles = Vale, Google, alex, Readability, Portfolio
# Front matter values and component props are data, not prose.
TokenIgnores = (<[A-Z][A-Za-z]+[^>]*/>)
