# Vale checks every page before it's published. The Google developer style, alex (inconsiderate wording) and
# Readability are the open-source packages from errata-ai, pinned in styles/VERSIONS. Portfolio holds the house rules
# that came out of the audit. Every exception below is a decision, recorded in quality/decisions.md.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Portfolio
# Quoted, not written: interface labels in bold and Keycloak's own messages in italics keep the product's wording.
IgnoredScopes = code, tt, strong, em

[*.{md,mdx,html}]
BasedOnStyles = Vale, Google, alex, Readability, Portfolio
# Keycloak's names for its admin console, admin REST API and admin events keep their wording.
TokenIgnores = ([Aa]dmin (?:console|REST API|events))
# "period" is the OTP policy's term for how long a code lasts. alex flags every use as possible profanity.
alex.ProfanityUnlikely = NO
# The Google developer style asks for sentence-case headings; the house style is Title Case (quality/decisions.md),
# checked by Portfolio.HeadingCase instead.
Google.Headings = NO
