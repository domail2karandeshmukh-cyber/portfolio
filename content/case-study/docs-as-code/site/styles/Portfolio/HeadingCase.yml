# Editorial standard: Title Case for every heading (the house style since 28 November 2026). Names keep their capitals
# (the exceptions list).
extends: capitalization
message: "Write the heading '%s' in Title Case."
level: error
scope: heading
match: $title
style: Chicago
indicators:
  - ':'
exceptions:
  - Keycloak
  - OTP
  - TOTP
  - REST
  - API
  - Docusaurus
  - Configure OTP
  - Mobile Authenticator Setup
  - Sessions
  - Credentials
