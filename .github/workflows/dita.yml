name: Publish the DITA samples

# Makes each document set of lib/dita-sets.mjs into a DITA 1.3 project (scripts/dita-sample.mjs), validates every file
# against the OASIS DTDs that DITA Open Toolkit ships, publishes HTML5 (with scripts/dita-html5.css) and PDF with DITA
# Open Toolkit, and commits the result to content/dita-samples, which the site serves at /studio/dita/<set>.
# Runs on demand, and when a set's documents, the list of sets, the document model or the publishing script changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/workbench/**", "content/scenarios/**", "lib/dita-sets.mjs", "src/doc.js", "scripts/dita-sample.mjs", "scripts/dita-html5.css"]

permissions:
  contents: write

env:
  DITA_OT: "4.3.4"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install DITA Open Toolkit and xmllint
        run: |
          sudo apt-get install -y libxml2-utils
          curl -sSL -o dita-ot.zip "https://github.com/dita-ot/dita-ot/releases/download/${DITA_OT}/dita-ot-${DITA_OT}.zip"
          unzip -q dita-ot.zip -d "$RUNNER_TEMP"
      - name: Validate and publish
        run: DITA_HOME="$RUNNER_TEMP/dita-ot-${DITA_OT}" node scripts/dita-sample.mjs --publish
      - name: Commit what was published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/dita-samples
          git diff --cached --quiet || git commit -m "Publish the DITA samples with DITA-OT ${DITA_OT}"
          git push
