name: Check the site

# Builds the site, tests the checker and the document model, follows every link, and opens the live site and every
# live project in a real browser. Runs on demand and every Monday morning. Run it after a release, once the
# release is live: the last step looks at the live site, not at this copy of the repository.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the site
        run: npm run build
      - name: Test the style checker and the document model
        run: node scripts/selftest.mjs
      - name: Follow every link
        run: node scripts/check-links.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate the DITA sample and publish it with DITA Open Toolkit
        run: |
          sudo apt-get install -y libxml2-utils
          curl -sSL -o dita-ot.zip https://github.com/dita-ot/dita-ot/releases/download/4.3.4/dita-ot-4.3.4.zip
          unzip -q dita-ot.zip -d "$RUNNER_TEMP"
          DITA_HOME="$RUNNER_TEMP/dita-ot-4.3.4" node scripts/dita-sample.mjs --publish
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a browser
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Open the live site and the live projects
        run: python scripts/check-live.py
