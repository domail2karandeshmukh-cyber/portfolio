name: Check the site

# Builds the site, tests the checker and the document model, follows every link, and opens the live site and every
# live project in a real browser. Runs on demand, after a change to main, and every Monday morning.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the site
        run: npm run build
      - name: Test the style checker and the document model
        run: node scripts/selftest.mjs
      - name: Follow every link
        run: node scripts/check-links.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a browser
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Open the live site and the live projects
        # A push is checked before it is deployed, so the live site may be a version behind: wait for the deployment.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then sleep 240; fi
          python scripts/check-live.py
