 <p><a href="/">Karan Deshmukh, technical writer</a></p>
</footer>
<script>
/* On a phone the list of pages is one scrolling row: bring the current page into view. */
(function () {
  var here = document.querySelector(".toc [aria-current]");
  if (!here) return;
  var row = here.parentNode;
  row.scrollLeft += here.getBoundingClientRect().left - row.getBoundingClientRect().left - 24;
})();
</script>
