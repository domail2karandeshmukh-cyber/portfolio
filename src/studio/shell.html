<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}} | Karan Deshmukh</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}{{path}}">
{{hreflang}}
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}} | Karan Deshmukh">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}{{path}}">
<meta property="og:image" content="{{url}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/hanken.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/studio/studio.css">
<script>document.documentElement.className="js"</script>
</head>
<body class="sample studio {{bodyclass}}">
<a class="skip" href="#main">Skip to content</a>
<header class="nav stuck">
 <div class="wrap nav-in">
  <a class="brand" href="/" translate="no">Karan Deshmukh</a>
  {{sitenav}}
  <div class="nav-act">
   {{lang}}
   {{mnav}}
   <!--#include cv-btn-->
  </div>
 </div>
</header>
<main id="main" class="wrap st-main st-sided">
<div class="st-layout">
{{sidebar}}
<div class="st-body">
 <nav class="crumbs" aria-label="Breadcrumb">{{crumbs}}</nav>
{{body}}
{{toolpager}}
</div>
</div>
</main>
<footer class="foot">
 <div class="wrap">
  <!--#include foot-main-->
  <div class="foot-base">
   <p class="foot-note">{{privacy}}</p>
   <!--#include foot-legal-->
  </div>
 </div>
</footer>
<noscript><p class="wrap st-nojs">The studio needs JavaScript.</p></noscript>
{{scripts}}
<script src="/nav.js" defer></script>
</body>
</html>
