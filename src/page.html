<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">{{robots}}
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{url}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/plex-cond-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css">
<script>document.documentElement.className="js"</script>
</head>
<body class="sample" data-linkedin="{{linkedin}}" data-lang="en">
<a class="skip" href="#main">Skip to content</a>
<div class="progress" aria-hidden="true"><i></i></div>

<header class="nav stuck">
 <div class="wrap nav-in">
  <a class="brand" href="/">Karan Deshmukh</a>
  {{sitenav}}
  <div class="nav-act">
   <!--#include search-btn-->
   <!--#include april-btn-->
   {{mnav}}
   <!--#include cv-btn-->
  </div>
 </div>
</header>

<main id="main" class="wrap">
 <nav class="crumbs" aria-label="Breadcrumb">{{crumbs}}</nav>
 {{body}}
</main>

<!--#include footer-->

<!--#include tools-->
<script src="/app.js" defer></script>
<script src="/nav.js" defer></script>
</body>
</html>
