<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">{{robots}}
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{url}}/og.png">

<meta property="og:image:height" content="630">

<meta name="theme-color" content="#0B1023">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/hanken.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css">
<script>document.documentElement.className="js"</script>
</head>
<body class="sample" data-linkedin="{{linkedin}}" data-lang="en">
<a class="skip" href="#main">Skip to content</a>
<div class="progress" aria-hidden="true"><i></i></div>

<header class="nav stuck">
 <div class="wrap nav-in">
  <a class="brand" href="/">Karan Deshmukh</a>
  <nav aria-label="Site">
   <a href="/docs">Library</a><a href="/#projects">Projects</a><a href="/#video">Video</a><a href="/#contact">Contact</a>
  </nav>
  <div class="nav-act">
   <button class="icon-btn" type="button" data-search aria-label="Search the documentation"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg><kbd aria-hidden="true">/</kbd></button>

   <a class="btn paper sm" href="{{cv}}" download>Download CV</a>
  </div>
 </div>
</header>

<main id="main" class="wrap">
 <nav class="crumbs" aria-label="Breadcrumb">{{crumbs}}</nav>
 {{body}}
</main>
